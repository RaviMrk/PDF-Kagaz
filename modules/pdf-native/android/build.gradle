plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.pdfkagaz.pdfnative'
version = '0.1.0'

android {
  namespace "com.pdfkagaz.pdfnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
  sourceSets {
    test {
      // The repo's PDF fixtures, read by the PdfBox tests through the classpath (see Fixtures.kt).
      resources.srcDirs += ['../../../__fixtures__']
    }
  }
}

dependencies {
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
  // The version :app resolves (releaseRuntimeClasspath); PickMultipleVisualMedia needs >= 1.7.0.
  implementation "androidx.activity:activity:1.8.2"
  // The version :app resolves; ServiceCompat.startForeground with a service type needs >= 1.12.0.
  implementation "androidx.core:core:1.18.0"
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
  // Pure Java (no .so). bcpkix/bcutil are certificate/CMS code; only bcprov's AES path is used
  // (proven by PdfBoxSupportTest's AES-256 round trip).
  implementation('com.tom-roush:pdfbox-android:2.0.27.0') {
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15to18'
    exclude group: 'org.bouncycastle', module: 'bcutil-jdk15to18'
  }
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.17'
}
