plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.pdfkagaz.pdfnative'
version = '0.1.0'

android {
  namespace "com.pdfkagaz.pdfnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
  testImplementation 'junit:junit:4.13.2'
}
